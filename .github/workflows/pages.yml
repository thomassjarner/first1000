name: Deploy Flet web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify practice and UI flows
        run: python -m pytest -q
      - name: Determine site base path
        id: base
        shell: bash
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          if [[ "$repo_name" == *.github.io ]]; then
            echo 'path=/' >> "$GITHUB_OUTPUT"
          else
            echo "path=/$repo_name/" >> "$GITHUB_OUTPUT"
          fi
      - name: Build static Flet website
        run: python tools/build_web.py --base-url '${{ steps.base.outputs.path }}'
      - name: Check packaged app
        run: python tools/fix_web_paths.py dist && python tools/check_distribution.py dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
